<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumiora - Cosmic Quote Generator (Single Language)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    overflow-x: hidden;
    direction: ltr;
  }
  body {
    font-family: 'Georgia', 'Noto Serif Devanagari', serif;
    background: #0b0e17;
    color: #fff;
    padding: 20px;
    min-height: 100vh;
    -webkit-touch-callout: none;
    width: 100%;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
  }
  @media (max-width: 850px) {
    .app { grid-template-columns: 1fr; }
    body { padding: 12px; }
  }
  .panel {
    background: #161b2b;
    border-radius: 12px;
    padding: 20px;
  }
  h1 {
    grid-column: 1 / -1;
    font-size: 22px;
    text-align: center;
    margin-bottom: 4px;
    font-family: Arial, sans-serif;
  }
  .subtitle {
    grid-column: 1 / -1;
    text-align: center;
    color: #9aa3c0;
    font-size: 13px;
    margin-bottom: 12px;
    font-family: Arial, sans-serif;
  }
  label {
    display: block;
    font-size: 13px;
    color: #9aa3c0;
    margin: 12px 0 6px;
    font-family: Arial, sans-serif;
  }
  textarea, select, input[type=range] {
    width: 100%;
    background: #0e1220;
    color: #fff;
    border: 1px solid #2a3150;
    border-radius: 8px;
    padding: 10px;
    font-family: 'Noto Serif Devanagari', 'Playfair Display', 'Georgia', serif;
    font-size: 15px;
    direction: ltr;
    text-align: left;
  }
  textarea { resize: vertical; min-height: 90px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    margin-top: 16px;
    background: linear-gradient(135deg, #4a6cf7, #7b4af7);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button * {
    pointer-events: none;
  }

  /* --- Card preview --- */
  .card-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #card {
    width: 100%;
    aspect-ratio: 4 / 5;
    max-width: 480px;
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: radial-gradient(ellipse at 70% 30%, #1a2a52 0%, #0b0e17 55%),
                linear-gradient(180deg, #050810 0%, #0b1226 50%, #0a1830 100%);
    background-size: cover;
    background-position: center;
  }
  /* dark overlay so text stays readable on top of uploaded photos */
  .photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.45) 100%);
    display: none;
    pointer-events: none;
  }
  #stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .nebula {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 25% 70%, rgba(90,140,255,0.25), transparent 40%),
      radial-gradient(circle at 75% 75%, rgba(200,150,90,0.15), transparent 35%),
      radial-gradient(circle at 60% 55%, rgba(120,160,255,0.15), transparent 45%);
    pointer-events: none;
  }
  .quote-text {
    position: absolute;
    top: 12%;
    left: 8%;
    right: 8%;
    text-align: center;
    direction: ltr;
    unicode-bidi: plaintext;
    font-size: 28px;
    line-height: 1.35;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    font-family: 'Noto Serif Devanagari', 'Playfair Display', 'Georgia', serif;
  }
  .brand {
    position: absolute;
    bottom: 4%;
    left: 0; right: 0;
    text-align: center;
    direction: ltr;
    unicode-bidi: plaintext;
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    font-family: 'Noto Serif Devanagari', 'Playfair Display', 'Georgia', serif;
  }
</style>
</head>
<body>

<div class="app">
  <h1>🌌 Cosmic Quote Generator — Aapki Soch</h1>
  <div class="subtitle">Space background wale motivational quote cards banaiye</div>

  <div class="panel">
    <label>Quote Text (Hindi / English / Spanish)</label>
    <textarea id="quoteInput">Act as if what you want is already yours, then the Universe will rearrange itself to make it happen.</textarea>

    <label>Font Size</label>
    <input type="range" id="fontSize" min="18" max="40" value="28">

    <label>Background Style (CSS)</label>
    <select id="bgStyle">
      <option value="blue">Deep Blue Galaxy</option>
      <option value="purple">Purple Nebula</option>
      <option value="teal">Teal Aurora</option>
      <option value="sunset">Sunset Cosmic</option>
      <option value="green">Green Aurora</option>
    </select>

    <label>Ya Apni Photo Upload Karein (background)</label>
    <input type="file" id="imageUpload" accept="image/*" style="width:100%;background:#0e1220;color:#fff;border:1px solid #2a3150;border-radius:8px;padding:10px;">
    <div style="margin-top:8px;">
      <button id="removeImageBtn" style="background:#3a1e2e;margin-top:0;">❌ Photo Hatayein (CSS background par wapas jaayein)</button>
    </div>

    <div class="row">
      <div>
        <label>Brand Text (niche)</label>
        <input type="text" id="brandInput" value="आपकी सोच" style="width:100%;background:#0e1220;color:#fff;border:1px solid #2a3150;border-radius:8px;padding:10px;">
      </div>
    </div>

    <button id="downloadBtn">📥 Image Download Karein</button>
    <div id="statusMsg" style="text-align:center; font-size:12px; color:#9aa3c0; margin-top:8px; font-family:Arial, sans-serif;"></div>
  </div>

  <div class="card-wrap">
    <div id="card">
      <canvas id="stars"></canvas>
      <div class="nebula" id="nebula"></div>
      <div class="photo-overlay" id="photoOverlay"></div>
      <div class="quote-text" id="quoteDisplay">Act as if what you want is already yours, then the Universe will rearrange itself to make it happen.</div>
      <div class="brand" id="brandDisplay">आपकी सोच</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const card = document.getElementById('card');

  function drawStars() {
    const rect = card.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for (let i=0; i<220; i++) {
      const x = Math.random()*canvas.width;
      const y = Math.random()*canvas.height;
      const r = Math.random()*1.4;
      const alpha = Math.random()*0.8 + 0.2;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fill();
    }
    // a few bigger glowing stars
    for (let i=0; i<8; i++) {
      const x = Math.random()*canvas.width;
      const y = Math.random()*canvas.height*0.9;
      ctx.beginPath();
      const grad = ctx.createRadialGradient(x,y,0,x,y,6);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.arc(x,y,6,0,Math.PI*2);
      ctx.fill();
    }
  }

  const bgStyles = {
    blue: 'radial-gradient(ellipse at 70% 30%, #1a2a52 0%, #0b0e17 55%), linear-gradient(180deg, #050810 0%, #0b1226 50%, #0a1830 100%)',
    purple: 'radial-gradient(ellipse at 65% 25%, #3a1e5c 0%, #0e0a1a 55%), linear-gradient(180deg, #0a0614 0%, #180d2e 50%, #24123f 100%)',
    teal: 'radial-gradient(ellipse at 70% 30%, #0e4a4a 0%, #071018 55%), linear-gradient(180deg, #030c10 0%, #08201f 50%, #0a2b2b 100%)',
    sunset: 'radial-gradient(ellipse at 70% 30%, #6a2e3a 0%, #1a0e14 55%), linear-gradient(180deg, #150a10 0%, #2e1420 50%, #3f1a1a 100%)',
    green: 'radial-gradient(ellipse at 70% 30%, #1e5c3e 0%, #0a1a12 55%), linear-gradient(180deg, #06140c 0%, #0d2e1c 50%, #123f28 100%)'
  };

  let uploadedImage = null; // holds data URL if a photo is uploaded

  const imageUpload = document.getElementById('imageUpload');
  const removeImageBtn = document.getElementById('removeImageBtn');
  const photoOverlay = document.getElementById('photoOverlay');
  const nebula = document.getElementById('nebula');
  const starsCanvas = document.getElementById('stars');

  imageUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      uploadedImage = ev.target.result;
      applyBackground();
    };
    reader.readAsDataURL(file);
  });

  removeImageBtn.addEventListener('click', () => {
    uploadedImage = null;
    imageUpload.value = '';
    applyBackground();
  });

  function applyBackground() {
    if (uploadedImage) {
      card.style.background = `url(${uploadedImage})`;
      card.style.backgroundSize = 'cover';
      card.style.backgroundPosition = 'center';
      photoOverlay.style.display = 'block';
      nebula.style.display = 'none';
      starsCanvas.style.display = 'none';
    } else {
      card.style.background = bgStyles[bgStyle.value];
      photoOverlay.style.display = 'none';
      nebula.style.display = 'block';
      starsCanvas.style.display = 'block';
    }
  }

  const quoteInput = document.getElementById('quoteInput');
  const quoteDisplay = document.getElementById('quoteDisplay');
  const brandInput = document.getElementById('brandInput');
  const brandDisplay = document.getElementById('brandDisplay');
  const fontSize = document.getElementById('fontSize');
  const bgStyle = document.getElementById('bgStyle');

  function updateCard() {
    quoteDisplay.textContent = quoteInput.value;
    brandDisplay.textContent = brandInput.value;
    quoteDisplay.style.fontSize = fontSize.value + 'px';
    applyBackground();
  }

  quoteInput.addEventListener('input', updateCard);
  brandInput.addEventListener('input', updateCard);
  fontSize.addEventListener('input', updateCard);
  bgStyle.addEventListener('change', updateCard);

  window.addEventListener('resize', drawStars);
  drawStars();
  updateCard();

  const downloadBtn = document.getElementById('downloadBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Prevent iOS long-press text-selection / context menu from hijacking the tap
  downloadBtn.addEventListener('contextmenu', (e) => e.preventDefault());
  downloadBtn.addEventListener('touchstart', (e) => { /* allow tap, block callout */ }, {passive: true});

  function generateFileName() {
    const today = new Date();
    const dateStr = today.getFullYear() + '-' +
      String(today.getMonth()+1).padStart(2,'0') + '-' +
      String(today.getDate()).padStart(2,'0');

    // take first 5-6 words of the quote, strip punctuation/Hindi matras-safe chars,
    // keep only letters/numbers/spaces, then join with hyphens
    let words = quoteInput.value
      .trim()
      .split(/\s+/)
      .slice(0, 6)
      .join(' ')
      .replace(/[^\p{L}\p{N}\s]/gu, '')  // remove punctuation, keep unicode letters (Hindi/English) and numbers
      .trim()
      .split(/\s+/)
      .join('-');

    if (!words) words = 'quote';

    return `aapki-soch-${dateStr}-${words}.png`;
  }

  function startDownload() {
    if (typeof html2canvas === 'undefined') {
      statusMsg.textContent = '⚠️ Download tool load nahi hua. Internet connection check karke page reload karein.';
      return;
    }
    statusMsg.textContent = '⏳ Image taiyar ho rahi hai...';
    downloadBtn.disabled = true;

    html2canvas(card, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: null })
      .then(canvasOut => {
        canvasOut.toBlob((blob) => {
          downloadBtn.disabled = false;
          if (!blob) {
            statusMsg.textContent = '⚠️ Image nahi ban payi, dubara try karein.';
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = generateFileName();
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          // Fallback for mobile browsers that block auto-download:
          // open the image in a new tab so the user can long-press and save it.
          setTimeout(() => {
            window.open(url, '_blank');
            statusMsg.textContent = '✅ Download shuru ho gaya. Agar download na ho to naye tab mein khuli image ko long-press karke "Save Image" karein.';
          }, 400);
        }, 'image/png');
      })
      .catch((err) => {
        downloadBtn.disabled = false;
        statusMsg.textContent = '⚠️ Kuch error aaya: ' + err.message;
      });
  }

  downloadBtn.addEventListener('click', startDownload);
</script>

</body>
</html>
